version: "3.8"

services:
  localstack-s3:
    image: localstack/localstack:latest
    container_name: localstack-s3
    ports:
      - "4566:4566"            # edge port for S3, etc.
    environment:
      - SERVICES=s3            # only spin up S3
      - DEBUG=1
      - PERSISTENCE=1          # enable state persistence
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./localstack-s3/volume:/var/lib/localstack   # <-- new volume root
      - /var/run/docker.sock:/var/run/docker.sock
