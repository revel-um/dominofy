services:
  postgres:
    image: postgres:15
    container_name: dominofy-db
    restart: always
    environment:
      POSTGRES_USER: dominofy
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: dominofy
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dominofy-redis
    restart: always
    ports:
      - "6379:6379"

  gcs:
    image: fsouza/fake-gcs-server:latest
    container_name: dominofy-gcs
    restart: always
    command:
      - -scheme
      - http
      - -host
      - 0.0.0.0
      - -port
      - "8000"
      - -backend
      - filesystem
      - -data
      - /data
      - -public-host
      - localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - ./gcs-data:/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: dominofy-backend
    restart: always
    env_file:
      - apps/backend/.env
    # depends_on:
    #   - postgres
    #   - gcs
    #   - redis
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://dominofy:secret@postgres:5432/dominofy
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: dominofy
      DATABASE_PASSWORD: secret
      DATABASE_NAME: dominofy
      DATABASE_SCHEMA: public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_CLOUD_PROJECT: local-gcp
      GCLOUD_PROJECT: local-gcp
      GCS_BUCKET: dominofy-local
      STORAGE_EMULATOR_HOST: http://gcs:8000
      GCS_PUBLIC_BASE: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:3000

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: dominofy-frontend
    restart: always
    env_file:
      - apps/web/.env
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_BASE_URL: http://localhost:3001/api/v1

volumes:
  postgres_data:
